<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Manager · 社交媒体管理平台</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<!-- Login Page -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>SMM</h1>
      <p>社交媒体管理平台</p>
    </div>
    <form id="login-form" onsubmit="return false;">
      <div class="form-group">
        <label>用户名</label>
        <input class="form-control" type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-control" type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <div id="login-error" class="login-error" style="display:none"></div>
      <button class="btn btn-primary login-btn" id="login-btn" type="submit">登 录</button>
    </form>
    <p class="login-hint">默认账号: admin / admin123</p>
  </div>
</div>

<div id="app" style="display:none">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="logo">SMM</h1>
      <span class="logo-sub">管理平台</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-view="dashboard" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>总览</span>
      </a>
      <a class="nav-item" data-view="accounts" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>账号管理</span>
      </a>
      <a class="nav-item" data-view="content" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>内容管理</span>
      </a>
      <a class="nav-item" data-view="publish" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <span>发布</span>
      </a>
      <a class="nav-item" data-view="calendar" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>内容日历</span>
      </a>
      <a class="nav-item" data-view="schedules" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>定时任务</span>
      </a>
      <a class="nav-item" data-view="analytics" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>数据分析</span>
      </a>
      <a class="nav-item" data-view="logs" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="16" x2="16" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>发布日志</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="logout-link" id="logout-btn" title="退出登录">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
      <span class="version">v1.0.0</span>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="main-content">
    <!-- Views are rendered dynamically by JavaScript -->
  </main>
</div>

<!-- Modal overlay -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal" id="modal-content">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/components/dashboard.js"></script>
<script src="/js/components/accounts.js"></script>
<script src="/js/components/content.js"></script>
<script src="/js/components/publish.js"></script>
<script src="/js/components/calendar.js"></script>
<script src="/js/components/analytics.js"></script>
<script src="/js/components/schedules.js"></script>
<script src="/js/components/logs.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
